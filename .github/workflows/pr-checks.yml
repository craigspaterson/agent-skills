name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Lint Markdown
        run: npx --yes markdownlint-cli@0.50.0 '**/*.md' --ignore node_modules

  sensitive-scan:
    runs-on: ubuntu-latest
    steps:
      # The PR is scan input only: no code from it runs while the deny-list is present.
      - name: Check out PR commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: pr
      - name: Check out trusted scanner from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .githooks/pre-commit
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trusted
      # Org and personal terms live in the SENSITIVE_DENYLIST repository secret (one
      # regex per line), never in the repo. Forked PRs get no secrets and skip that list.
      - name: Scan every PR commit
        env:
          DENYLIST: ${{ secrets.SENSITIVE_DENYLIST }}
          SCAN_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          scanner="$GITHUB_WORKSPACE/trusted/.githooks/pre-commit"
          if [ -f "$scanner" ]; then
            export DENYLIST_FILE="$RUNNER_TEMP/denylist"
            printf '%s\n' "$DENYLIST" > "$DENYLIST_FILE"
          else
            # Base branch has no scanner yet (the PR that adds it): run the PR's copy
            # without the deny-list, so no secret is exposed to PR-controlled code.
            echo "::warning::No scanner on the base branch; using the PR's copy without the deny-list."
            scanner="$GITHUB_WORKSPACE/pr/.githooks/pre-commit"
          fi
          cd pr && bash "$scanner"
