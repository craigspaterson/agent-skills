name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Lint Markdown
        run: npx --yes markdownlint-cli@0.50.0 '**/*.md' --ignore node_modules

  sensitive-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Org and personal terms live in the SENSITIVE_DENYLIST repository secret (one
      # regex per line), never in the repo. Forked PRs get no secrets and skip that list.
      - name: Write deny-list
        env:
          DENYLIST: ${{ secrets.SENSITIVE_DENYLIST }}
        run: printf '%s\n' "$DENYLIST" > .githooks/denylist.local
      - name: Scan PR changes
        env:
          SCAN_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: bash .githooks/pre-commit
